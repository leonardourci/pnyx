name: Checks required

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main]
    paths:
      - '**'
      - '!**/*.md'
      - 'skills/**'
      - 'test/**'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: checks-required-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Checks ran for this commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/check-marker.ts
            scripts/marker.ts
            scripts/change-policy.ts
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check the pnpm verify marker against the PR head
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/check-marker.ts
