# Generated by `no-mistakes ci-workflow` from .no-mistakes.yaml; the setup steps
# were changed by hand from Go to pnpm + Node 22. Keep Lint and Test in sync
# with commands.lint and commands.test.
name: CI

on:
  push:
    branches: ['main']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: |
          pnpm install --frozen-lockfile

      - name: Lint
        run: |
          pnpm run lint

      - name: Test
        run: |
          pnpm test
