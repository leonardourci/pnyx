name: Tests

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scope:
    name: Test scope
    # Nothing runs while the repository is private.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tests: ${{ steps.scope.outputs.tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # The same selection as pnpm verify: a docs-only change needs no tests.
      - id: scope
        run: |
          git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/paths"
          node --input-type=module -e "
            import { readFileSync } from 'node:fs'
            import { requiredChecks } from './scripts/verification/required-checks.ts'
            const paths = readFileSync(process.argv[1], 'utf8').split('\n').filter(Boolean)
            console.log('tests=' + requiredChecks({ paths }).tests)
          " "$RUNNER_TEMP/paths" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  test:
    name: Lint, build and tests
    needs: scope
    # A skipped job reports success, so a docs-only change still passes this check; a failed
    # scope job still runs the tests rather than passing without them.
    if: ${{ !cancelled() && !github.event.repository.private && !(needs.scope.result == 'success' && needs.scope.outputs.tests == 'none') }}
    # Every run waits for the owner's approval in this environment.
    environment: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      # Lint runs beside the build, which takes about as long as the typecheck and ESLint together.
      - name: Lint and build
        run: |
          pnpm run typecheck & typecheck=$!
          pnpm exec eslint . & eslint=$!
          pnpm run lint:css & css=$!
          pnpm run build & build=$!
          failed=0
          for job in "$typecheck" "$eslint" "$css" "$build"; do wait "$job" || failed=1; done
          exit "$failed"

      # Integration files and browser journeys, in a random order; the runner image carries PostgreSQL and Google Chrome.
      - name: Tests
        env:
          PNYX_KEEP_TEST_FILES: ${{ runner.temp }}/test-files
        run: pnpm exec vitest run

      # The tests' scratch homes and the Postgres log, so a failure only CI shows can be read.
      - name: Keep the test files
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-files
          path: ${{ runner.temp }}/test-files
          retention-days: 3
          if-no-files-found: ignore
