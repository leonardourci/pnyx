name: Tests

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    paths:
      - '**'
      - '!docs/**'
      - '!**/*.md'
      - 'skills/**'
      - '**/fixtures/**'

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, build and tests
    if: ${{ !github.event.repository.private }}
    # Every run waits for the owner's approval in this environment.
    environment: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - name: Lint and build
        run: |
          pnpm run typecheck & typecheck=$!
          pnpm exec eslint . & eslint=$!
          pnpm run lint:css & css=$!
          pnpm run build & build=$!
          failed=0
          for job in "$typecheck" "$eslint" "$css" "$build"; do wait "$job" || failed=1; done
          exit "$failed"

      # Integration files and browser journeys, in a random order; the runner image carries PostgreSQL and Google Chrome.
      - name: Tests
        env:
          PNYX_KEEP_TEST_FILES: ${{ runner.temp }}/test-files
        run: pnpm exec vitest run

      # The tests' scratch homes and the Postgres log, so a failure only CI shows can be read.
      - name: Keep the test files
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-files
          path: ${{ runner.temp }}/test-files
          retention-days: 3
          if-no-files-found: ignore
