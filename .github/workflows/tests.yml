name: Tests

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scope:
    name: Test scope
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tests: ${{ steps.scope.outputs.tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install --prefix "$RUNNER_TEMP/deslop-scope" --ignore-scripts --no-audit --no-fund --package-lock=false github:leonardourci/deslop#e7c248c3be3de930a8ff2138b8a93e1cf9deac08

      - id: scope
        run: |
          git diff --no-renames --name-only HEAD^1 HEAD > "$RUNNER_TEMP/paths"
          node --input-type=module -e "
            import { readFileSync } from 'node:fs'
            // The pinned selector is installed outside the checkout at a runner-specific path.
            const { select } = await import(process.env.RUNNER_TEMP + '/deslop-scope/node_modules/deslop/src/config.js')
            const config = JSON.parse(readFileSync('deslop.config.json', 'utf8'))
            const paths = readFileSync(process.argv[1], 'utf8').split('\n').filter(Boolean)
            if (!paths.length) throw new Error('Empty change list')
            const selected = select({ config, paths })
            const tests = selected.commands.length || selected.requiredChecks.length ? 'all' : 'none'
            console.log('tests=' + tests)
          " "$RUNNER_TEMP/paths" >> "$GITHUB_OUTPUT"

  test:
    name: Lint, build and tests
    needs: scope
    # A failed scope runs tests; a docs-only skip still satisfies branch protection.
    if: ${{ !cancelled() && !github.event.repository.private && !(needs.scope.result == 'success' && needs.scope.outputs.tests == 'none') }}
    # Every run waits for the owner's approval in this environment.
    environment: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - name: Lint and build
        run: |
          pnpm run typecheck & typecheck=$!
          pnpm exec eslint . & eslint=$!
          pnpm run lint:css & css=$!
          pnpm run build & build=$!
          failed=0
          for job in "$typecheck" "$eslint" "$css" "$build"; do wait "$job" || failed=1; done
          exit "$failed"

      # Integration files and browser journeys, in a random order; the runner image carries PostgreSQL and Google Chrome.
      - name: Tests
        env:
          PNYX_KEEP_TEST_FILES: ${{ runner.temp }}/test-files
        run: pnpm exec vitest run

      # The tests' scratch homes and the Postgres log, so a failure only CI shows can be read.
      - name: Keep the test files
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-files
          path: ${{ runner.temp }}/test-files
          retention-days: 3
          if-no-files-found: ignore
