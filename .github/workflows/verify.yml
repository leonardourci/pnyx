name: Verify
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: verify-marker-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  marker:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const MARKER_PREFIX = "<!-- verify:v1 ";
            const MARKER_END = " -->";
            function markerFromBody({ body }) {
              const markers = body.split('\n').filter(line => line.startsWith(MARKER_PREFIX));
              if (markers.length !== 1 || !markers[0].endsWith(MARKER_END)) return null;
              try { return JSON.parse(markers[0].slice(MARKER_PREFIX.length, -MARKER_END.length)); }
              catch { return null; }
            }
            function validMarker({ marker, head, localRunCounts = true }) {
              return marker?.head === head && /^[0-9a-f]{40,64}$/.test(head)
                && marker.version === 1 && ['local', 'ci'].includes(marker.mode)
                && (marker.mode !== 'local' || localRunCounts)
                && marker.steps?.passed === true && Array.isArray(marker.steps.names)
                && marker.review?.clean === true && typeof marker.review.provider === 'string' && marker.review.provider.length > 0
                && Number.isInteger(marker.review.round) && marker.review.round >= 1 && marker.review.round <= 3
                && typeof marker.finishedAt === 'string' && Number.isFinite(Date.parse(marker.finishedAt));
            }
            const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number: context.issue.number});
            let localRunCounts = true;
            try {
              const {data: file} = await github.rest.repos.getContent({...context.repo, path: 'verify.config.json', ref: context.payload.repository.default_branch});
              const config = JSON.parse(Buffer.from(file.content, 'base64').toString());
              localRunCounts = config.localRunCounts !== false;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const marker = markerFromBody({body: pr.body || ''});
            if (!validMarker({marker, head: pr.head.sha, localRunCounts})) core.setFailed('Run verify run on the exact PR head with a clean review.');
