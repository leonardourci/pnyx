name: Verify

# pull_request_target runs this workflow and its checker from the base branch, so a pull
# request cannot change the check that judges it. It reads the PR through the API only and
# never checks out or runs PR code.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: verify-marker-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: pnpm verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/check-marker.ts
            scripts/marker.ts
            scripts/required-checks.ts
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check the pnpm verify marker against the PR head
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/check-marker.ts
