name: Verification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify contribution
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4

      - run: pnpm install --frozen-lockfile

      - name: Check browser prerequisite
        run: google-chrome --version

      - run: pnpm verify --checks-only
        env:
          PNYX_CHROME: /usr/bin/google-chrome

      - name: Keep verification failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: /tmp/pnyx-verify-*/*.log
          if-no-files-found: ignore
