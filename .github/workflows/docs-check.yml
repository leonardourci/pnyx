name: Docs check

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: docs-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scope:
    name: Change scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Only trusted metadata code can write the docs result; this job never checks out PR code.
    permissions:
      contents: read
      pull-requests: read
      checks: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Install the reviewed selector, never a dependency supplied by the PR.
      - name: Install trusted selector
        run: npm install --prefix "$RUNNER_TEMP/deslop-scope" --ignore-scripts --no-audit --no-fund --package-lock=false github:leonardourci/deslop#70df30c4e5ac4b58b655c3b95d65bc6b22db5ba6

      - uses: actions/github-script@v8
        id: scope
        with:
          script: |
            const { select } = await import(`${process.env.RUNNER_TEMP}/deslop-scope/node_modules/deslop/src/config.js`);
            let run = true;
            const head = context.payload.pull_request.head.sha;
            try {
              const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: context.issue.number });
              const files = await github.paginate(github.rest.pulls.listFiles, { ...context.repo, pull_number: context.issue.number, per_page: 100 });
              if (files.length > 0 && files.length === pr.changed_files && pr.head.sha === head) {
                const { data: file } = await github.rest.repos.getContent({ ...context.repo, path: 'deslop.config.json', ref: context.payload.repository.default_branch });
                const config = JSON.parse(Buffer.from(file.content, 'base64').toString());
                const paths = files.flatMap(file => file.previous_filename ? [file.previous_filename, file.filename] : [file.filename]);
                const selection = select({ config, paths });
                run = selection.commands.length > 0 || selection.requiredChecks.length > 0;
                const { data: current } = await github.rest.pulls.get({ ...context.repo, pull_number: context.issue.number });
                if (current.head.sha !== head) run = true;
              }
            } catch (error) {
              run = true;
              core.warning(`Scope unavailable; full CI is required: ${error.message}`);
            }
            if (!run) {
              await github.rest.checks.create({
                ...context.repo,
                name: 'Lint, build and tests',
                head_sha: head,
                status: 'completed',
                conclusion: 'success',
                output: { title: 'Documentation only', summary: 'No code checks selected by the default-branch policy.' }
              });
            }
            core.setOutput('run', String(run));
