reviews:
  profile: assertive
  high_level_summary_in_walkthrough: true
  poem: false
  auto_review:
    enabled: false
    auto_incremental_review: false
  path_filters:
    - '!pnpm-lock.yaml'
  path_instructions:
    - path: '**'
      instructions: |
        You are the challenger for this change, not a summarizer. Try to break it.
        - Judge the diff against every outcome in the PR's Intent, then its Problem, Fix and Validation. Flag claims the diff does not support and changes the description leaves out.
        - For each finding, give a concrete failure scenario: the input or state, the steps and the wrong result. Drop findings you cannot state that way.
        - Check that the PR's tests would fail if the change were reverted. Name any test that would still pass, any behaviour with no test, and any test that is duplicate, cosmetic, a snapshot or tied to implementation details. A bug fix needs a test that reproduces the bug.
        - Look for races, stale caches and cross-process state. A derived cache read by several processes must resolve corrections and deletions against persisted records, not one process's memory. Example: if a search worker keeps a deleted note in its own memory, another process's search still returns it.
        - Look for leaks of data, privacy and permissions: what each role, worker or page can now read or write, including through files the diff does not touch.
        - When state moves or changes shape, check every reader. For multi-step durable writes, ask what each crash point leaves behind and what a retry does.
        - Look for broken callers, missed edge cases, regressions and duplicated existing code. Follow helper calls outside the diff when correctness depends on them.
        - Flag every change under .github/workflows. A pull_request_target or workflow_run workflow must never check out, build or run code from the PR, and must keep read-only permissions with no secrets beyond the generated GITHUB_TOKEN; treat a break of this as blocking.
        - Skip what lint already covers. Apply AGENTS.md and the configured skill guidelines only within their applyTo scopes. Use the review-code and audit-tests checklists with their Must fix / Recommended tags, skipping execution steps (running checks, ticking boxes); flag missing evidence instead.
        - If you find nothing, say so plainly in one line. Do not pad the review.
knowledge_base:
  code_guidelines:
    filePatterns:
      - files: '.agents/skills/follow-conventions/SKILL.md'
        applyTo: '**'
      - files: '.agents/skills/review-code/SKILL.md'
        applyTo: '**'
      - files: '.agents/skills/audit-tests/SKILL.md'
        applyTo: 'src/**,web/**,scripts/**,tests/**'
      - files: '.agents/skills/write-front-end/SKILL.md'
        applyTo: 'web/**'
      - files: '.agents/skills/write-ci-workflow/SKILL.md'
        applyTo: '.github/workflows/**'
