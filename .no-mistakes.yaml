# no-mistakes gate configuration. commands, test.instructions and
# review.path_instructions are read only from the default-branch copy.
commands:
  prepare: pnpm install --frozen-lockfile
  lint: pnpm run lint
  test: pnpm test

test:
  instructions: |
    Run the repository's deterministic suite, `pnpm test`, as the baseline and treat its result as the primary evidence.
    Tests and any extra scenario must never touch the real ~/.pnyx, a real Firstmate home, a real Paseo, Herdr or tmux session, or any real terminal.
    Set PNYX_HOME to a fresh temporary directory, bind any server to 127.0.0.1 on a random port, and use inputs from test/fixtures/.
    Make no outbound network calls, give every command a short timeout, and never run a command that waits indefinitely.
  evidence:
    store_in_repo: false
    attach_media: false

review:
  path_instructions:
    - path: "src/cli/**"
      instructions: |
        pnyx-axi follows AXI (https://axi.md/): compact TOON output through axi-sdk-js, minimal default fields, explicit empty states, structured errors with codes, no interactive prompts, and next-step hints. A no-argument summary must never start infrastructure.
    - path: "src/core/**"
      instructions: |
        The reducer and rules must be pure and deterministic: no I/O, clock, randomness or environment reads. Every input fact comes from the event, so replaying the same log yields the same board.
    - path: "src/store/**"
      instructions: |
        events.jsonl is append-only and never rewritten, truncated or reordered. pnyx-axi is its only writer; spools are ingress buffers, not writers. snapshot.json is a rebuildable cache replaced atomically after a durable append.
    - path: "src/integrations/hooks/**"
      instructions: |
        Hooks must be silent (no stdout or stderr), fast, and always exit 0. They must not wait on a network call, browser or model; when the service is down they spool locally.
    - path: "setup/**"
      instructions: |
        Installed hooks must be silent, fast and always exit 0, and installation must keep the user's existing hook entries.
    - path: "test/**"
      instructions: |
        Tests must not touch the real ~/.pnyx, real Firstmate homes, Paseo, Herdr, tmux or any real terminal. They use a temporary PNYX_HOME, a random port and test/fixtures/.
